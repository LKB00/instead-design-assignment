<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="620" height="269.640625" viewBox="626 110.40625 620 269.640625"><g id="Chat / Reply"><text dominant-baseline="text-after-edge" font-family="Lato, sans-serif" font-size="14px" font-weight="400" unicode-bidi="isolate" fill="rgb(36, 40, 44)"><tspan xml:space="preserve" x="626" y="130.40625" textLength="493.421875" lengthAdjust="spacingAndGlyphs">One tax form from her investments hasn’t come in, and her return is due in 2 days.</tspan></text><text dominant-baseline="text-after-edge" font-family="Lato, sans-serif" font-size="14px" font-weight="400" unicode-bidi="isolate" fill="rgb(36, 40, 44)"><tspan xml:space="preserve" x="626" y="170.203125" textLength="213.125" lengthAdjust="spacingAndGlyphs">A few ways I can keep this on track:</tspan></text><text dominant-baseline="text-after-edge" font-family="Lato, sans-serif" font-size="14px" font-weight="400" fill="rgb(36, 40, 44)"><tspan xml:space="preserve" x="650" y="217" textLength="8.125" lengthAdjust="spacingAndGlyphs">•</tspan></text><text dominant-baseline="text-after-edge" font-family="Lato, sans-serif" font-size="14px" font-weight="400" unicode-bidi="isolate" fill="rgb(36, 40, 44)"><tspan xml:space="preserve" x="666" y="217" textLength="289.390625" lengthAdjust="spacingAndGlyphs">Draft a reminder asking Meera to send the form</tspan></text><text dominant-baseline="text-after-edge" font-family="Lato, sans-serif" font-size="14px" font-weight="400" fill="rgb(36, 40, 44)"><tspan xml:space="preserve" x="650" y="254.75" textLength="8.125" lengthAdjust="spacingAndGlyphs">•</tspan></text><text dominant-baseline="text-after-edge" font-family="Lato, sans-serif" font-size="14px" font-weight="400" unicode-bidi="isolate" fill="rgb(36, 40, 44)"><tspan xml:space="preserve" x="666" y="254.75" textLength="265.140625" lengthAdjust="spacingAndGlyphs">File an extension so the deadline isn’t at risk</tspan></text><text dominant-baseline="text-after-edge" font-family="Lato, sans-serif" font-size="14px" font-weight="400" fill="rgb(36, 40, 44)"><tspan xml:space="preserve" x="650" y="292.5" textLength="8.125" lengthAdjust="spacingAndGlyphs">•</tspan></text><text dominant-baseline="text-after-edge" font-family="Lato, sans-serif" font-size="14px" font-weight="400" unicode-bidi="isolate" fill="rgb(36, 40, 44)"><tspan xml:space="preserve" x="666" y="292.5" textLength="329.703125" lengthAdjust="spacingAndGlyphs">Prepare the rest of the return and leave that part open</tspan></text><text dominant-baseline="text-after-edge" font-family="Lato, sans-serif" font-size="14px" font-weight="400" unicode-bidi="isolate" fill="rgb(36, 40, 44)"><tspan xml:space="preserve" x="626" y="332.25" textLength="135.3125" lengthAdjust="spacingAndGlyphs">Which would you like?</tspan></text><g id="Chat / Reply actions"><g id="Icon / thumbsUp" transform="matrix(0.583333 0 0 0.583333 629 355.047)"><path d="M7 10v12" fill="none" stroke="rgb(91, 94, 97)" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5px"/><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z" fill="none" stroke="rgb(91, 94, 97)" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5px"/></g><g id="Icon / thumbsDown" transform="matrix(0.583333 0 0 0.583333 655 355.047)"><path d="M17 14V2" fill="none" stroke="rgb(91, 94, 97)" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5px"/><path d="M9 18.12 10 14H4.17a2 2 0 0 1-1.92-2.56l2.33-8A2 2 0 0 1 6.5 2H20a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2.76a2 2 0 0 0-1.79 1.11L12 22a3.13 3.13 0 0 1-3-3.88Z" fill="none" stroke="rgb(91, 94, 97)" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5px"/></g><g id="Icon / filePen" transform="matrix(0.583333 0 0 0.583333 681 355.047)"><path d="M12.5 22H18a2 2 0 0 0 2-2V7l-5-5H6a2 2 0 0 0-2 2v9.5" fill="none" stroke="rgb(91, 94, 97)" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5px"/><path d="M14 2v4a2 2 0 0 0 2 2h4" fill="none" stroke="rgb(91, 94, 97)" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5px"/><path d="M13.378 15.626a1 1 0 1 0-3.004-3.004l-5.01 5.012a2 2 0 0 0-.506.854l-.837 2.87a.5.5 0 0 0 .62.62l2.87-.837a2 2 0 0 0 .854-.506z" fill="none" stroke="rgb(91, 94, 97)" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5px"/></g></g></g></svg>