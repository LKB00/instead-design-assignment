<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Client list — status signal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  body{margin:0}
  .rail *{box-sizing:border-box}
  .rail{font-family:'Public Sans',-apple-system,sans-serif}
  .row-btn{all:unset;box-sizing:border-box;cursor:pointer}
  .row-btn:focus-visible{outline:2px solid #24282C;outline-offset:2px;border-radius:12px}
</style>
</helmet>

<div class="rail" style="width: 380px; height: 760px; background: #F7F6F0; display: flex; flex-direction: column; overflow: hidden; border: 1px solid #E4E1D6;">

  <!-- header -->
  <div style="padding: 22px 20px 14px; display: flex; flex-direction: column; gap: 2px; border-bottom: 1px solid #E4E1D6;">
    <div style="font-size: 19px; font-weight: 700; color: #24282C; letter-spacing: -0.01em;">Clients</div>
    <div style="font-size: 12.5px; color: #767A72;">{{clientCount}} active</div>
  </div>

  <div style="flex: 1; overflow-y: auto; padding: 10px 12px 24px;">

    <!-- grouped: attention section -->
    <sc-if value="{{grouped}}" hint-placeholder-val="{{true}}">
      <div style="display: flex; align-items: center; gap: 8px; padding: 14px 8px 6px;">
        <span style="width: 7px; height: 7px; border-radius: 999px; background: #C97B4A; display: inline-block; flex: none;"></span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #8A4B22;">Needs attention · {{attentionCount}}</span>
      </div>

      <sc-for list="{{attentionRows}}" as="client" hint-placeholder-count="3">
        <button type="button" class="row-btn" aria-label="{{client.ariaLabel}}" style="width: 100%; display: flex; align-items: center; gap: 12px; padding: 9px 8px; border-radius: 12px;">
          <div style="position: relative; flex: none; width: 38px; height: 38px;">
            <div style="width: 38px; height: 38px; border-radius: 999px; background: #E7E4D8; color: #24282C; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600;">{{client.initials}}</div>
            <span aria-hidden="true" style="position: absolute; right: -2px; bottom: -2px; width: 12px; height: 12px; border-radius: 999px; background: #C97B4A; border: 2px solid #F7F6F0;"></span>
          </div>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; text-align: left;">
            <div style="font-size: 14px; font-weight: 600; color: #24282C; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{client.name}}</div>
            <div style="font-size: 11.5px; color: #8A4B22; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{client.note}}</div>
          </div>
          <span style="flex: none; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; font-weight: 700; letter-spacing: 0.03em; color: #24282C; background: #C2EF72; padding: 3px 9px; border-radius: 999px;">{{client.entity}}</span>
        </button>
      </sc-for>

      <div style="height: 1px; background: #E4E1D6; margin: 10px 8px 4px;"></div>
    </sc-if>

    <!-- remaining / all clients -->
    <sc-for list="{{otherRows}}" as="client" hint-placeholder-count="4">
      <button type="button" class="row-btn" aria-label="{{client.ariaLabel}}" style="width: 100%; display: flex; align-items: center; gap: 12px; padding: 9px 8px; border-radius: 12px;">
        <div style="position: relative; flex: none; width: 38px; height: 38px;">
          <div style="width: 38px; height: 38px; border-radius: 999px; background: #E7E4D8; color: #24282C; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600;">{{client.initials}}</div>
          <sc-if value="{{client.showDot}}" hint-placeholder-val="{{false}}">
            <span aria-hidden="true" style="position: absolute; right: -2px; bottom: -2px; width: 12px; height: 12px; border-radius: 999px; background: {{client.dotColor}}; border: 2px solid #F7F6F0;"></span>
          </sc-if>
        </div>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; text-align: left;">
          <div style="font-size: 14px; font-weight: 600; color: #24282C; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{client.name}}</div>
          <sc-if value="{{client.note}}" hint-placeholder-val="{{false}}">
            <div style="font-size: 11.5px; color: #767A72; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{client.note}}</div>
          </sc-if>
        </div>
        <span style="flex: none; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; font-weight: 700; letter-spacing: 0.03em; color: #24282C; background: #C2EF72; padding: 3px 9px; border-radius: 999px;">{{client.entity}}</span>
      </button>
    </sc-for>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"scenario":{"editor":"enum","default":"grouped","options":["grouped","few-attention","calm"]},"$preview":{"width":380,"height":760}}'>
class Component extends DCLogic {
  initials(name) {
    const parts = name.trim().split(/\s+/);
    const first = parts[0] ? parts[0][0] : '';
    const last = parts.length > 1 ? parts[parts.length - 1][0] : '';
    return (first + last).toUpperCase();
  }

  dataset(scenario) {
    if (scenario === 'few-attention') {
      return [
        { name: 'Daniel Cho', entity: '1040', status: 'on_track' },
        { name: 'Priya Nair', entity: '1040', status: 'needs_attention', note: 'Missing signature on Form 8879' },
        { name: 'Alderwood LLC', entity: '1065', status: 'in_progress', note: 'Gathering K-1 documents' },
        { name: 'Fern & Co.', entity: '1120S', status: 'on_track' }
      ];
    }
    if (scenario === 'calm') {
      return [
        { name: 'Daniel Cho', entity: '1040', status: 'on_track' },
        { name: 'Sana Kapoor', entity: '1040', status: 'on_track' },
        { name: 'Fern & Co.', entity: '1120S', status: 'on_track' },
        { name: 'Alderwood LLC', entity: '1065', status: 'in_progress', note: 'Draft under review' }
      ];
    }
    return [
      { name: 'Meera Iyer', entity: '1040', status: 'needs_attention', note: 'K-1 missing, due in 2 days' },
      { name: 'Raghav Sethi', entity: '1120', status: 'needs_attention', note: 'E-signature overdue 6 days' },
      { name: 'Whitfield Family Trust', entity: '1041', status: 'needs_attention', note: 'Extension deadline Friday' },
      { name: 'Priya Nair', entity: '1040', status: 'in_progress', note: 'Draft under review' },
      { name: 'Alderwood LLC', entity: '1065', status: 'in_progress', note: 'Gathering documents' },
      { name: 'Daniel Cho', entity: '1040', status: 'on_track' },
      { name: 'Fern & Co.', entity: '1120S', status: 'on_track' },
      { name: 'Sana Kapoor', entity: '1040', status: 'on_track' }
    ];
  }

  statusWord(status) {
    if (status === 'needs_attention') return 'Needs attention';
    if (status === 'in_progress') return 'In progress';
    return 'On track';
  }

  renderVals() {
    const scenario = this.props.scenario ?? 'grouped';
    const clients = this.dataset(scenario);
    const attention = clients.filter((c) => c.status === 'needs_attention');
    const grouped = attention.length >= 3;

    const toRow = (c) => ({
      name: c.name,
      entity: c.entity,
      initials: this.initials(c.name),
      note: c.note || null,
      showDot: c.status === 'in_progress' || (c.status === 'needs_attention' && !grouped),
      dotColor: c.status === 'needs_attention' ? '#C97B4A' : 'rgba(36,40,44,0.55)',
      ariaLabel: c.name + ', ' + c.entity + ', ' + this.statusWord(c.status)
    });

    return {
      clientCount: clients.length,
      grouped,
      attentionCount: attention.length,
      attentionRows: grouped ? attention.map(toRow) : [],
      otherRows: (grouped ? clients.filter((c) => c.status !== 'needs_attention') : clients).map(toRow)
    };
  }
}
</script>
</body>
</html>
